# 评估门禁 CI：push/PR 触发，金标集实跑 + 硬指标一票否决。
# 需配置 secret：DASHSCOPE_API_KEY（百炼 LLM/embedding）。
name: eval-gate

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medical_agent
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      neo4j:
        image: neo4j:5.26.0
        env:
          NEO4J_AUTH: neo4j/neo4j1234
        ports: ["7687:7687"]
        options: >-
          --health-cmd="cypher-shell -u neo4j -p neo4j1234 'RETURN 1'"
          --health-interval=10s --health-timeout=5s --health-retries=20
      qdrant:
        image: qdrant/qdrant:v1.15.0
        ports: ["6333:6333"]

    env:
      # CI 服务端口（覆盖 config.py 本机默认 7688/6335）
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j1234
      QDRANT_HOST: 127.0.0.1
      QDRANT_PORT: 6333
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: medical_agent
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      # CI 无 key：显式开启离线哈希向量（构建/查询同空间，仅保链路可运行，无语义质量）
      EMBEDDING_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Init schema
        run: mysql -h 127.0.0.1 -uroot -proot < sql/schema.sql

      # CI 无真实数据集下载 → 模拟数据兜底（§2.2）
      - name: Prepare data (simulated)
        run: python backend/scripts/prepare_data.py --generate

      - name: Build graph
        run: python backend/scripts/build_graph.py

      - name: Build vector DB
        run: python backend/scripts/build_vector_db.py

      - name: Load golden set
        run: python backend/scripts/gen_golden.py

      - name: Run evaluation
        run: python backend/scripts/run_eval.py

      - name: Gate (exit code decides)
        run: python backend/scripts/gate.py
